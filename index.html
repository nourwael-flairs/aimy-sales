<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover is what makes env(safe-area-inset-*) report anything
       other than 0 on iOS: without it the float bar cannot clear a home
       indicator, because the page is never told there is one.
       interactive-widget=resizes-content makes the soft keyboard shrink the
       LAYOUT viewport rather than only the visual one, so a fixed composer is
       lifted by the browser instead of being left underneath the keyboard.
       assets/aimy-viewport.js measures the keyboard as well, and the two
       cannot double-compensate — see the note at --kb. Matches AiMY QA. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>AiMY Sales</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Poppins. is gone. It was `--font-display` against Urbanist as
       `--font-sans`, and the two are both geometric sans with near-identical
       skeletons — at the sizes this product sets, the pairing separated
       nothing and headings did not anchor the groups under them. Urbanist 800
       does the display role, and the font request loses a whole family.
       Argued in sales.css §THE TYPE SYSTEM, filed in GAPS.md. -->
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />

  <!-- The AiMY mark as the tab icon, pointing at the asset that was already
       here. `Aimy-full.svg` is the MARK — one path, the radial gradient, a
       151×147 box; `Aimy-small.svg` is the wordmark at 418 wide, which is
       four hundred pixels of lettering rendered into sixteen. The filenames
       read the other way round, hence the note. -->
  <link rel="icon" type="image/svg+xml" href="assets/Aimy-full.svg" />
  <link rel="stylesheet" href="assets/aimy-ds.css" />
  <!-- ══ THE TWO STAMPS MOVE TOGETHER, AND THE BUILD PANEL DEPENDS ON IT ══

       `?v=` is what stops a browser serving yesterday's file, and this
       product carries it on the stylesheet and on the script as two separate
       literals holding one number. Bump one and not the other and the
       browser serves new markup against old rules — which is not a visible
       error, it is a page where some rules apply and some do not, and it
       cost an afternoon of chasing rules that were correct in the file.

       Worse for the prototype panel: `BUILD` reads the stamp off sales.js
       alone and prints it as "the build". If the CSS lags, that stamp is a
       lie told to the one person trying to report what they are looking at.

       So: one number, in both places, every time. -->
  <link rel="stylesheet" href="assets/sales.css?v=50" />

  <!-- ONE UI SCALE, AND IT LOADS HERE FOR A REASON.

       The sheet declares `zoom: var(--ui-scale)` on <body>; the script publishes
       the number. Both are in <head> and the script is BLOCKING, so the scale is
       applied before first paint — a 2560 monitor that got these at the end of
       <body> would paint the unscaled layout and snap.

       After sales.css, so the shell rules it supersedes are already in the
       cascade. Ported from AiMY QA; the argument for the mechanism over px-to-rem
       is at the top of the sheet. -->
  <link rel="stylesheet" href="assets/bdr.css?v=50" />
  <link rel="stylesheet" href="assets/aimy-responsive.css?v=50" />
  <script src="assets/aimy-viewport.js?v=50"></script>

  <script>
    /* Apply saved theme before paint to avoid flash. Default = dark.
       Not in aimy-ds.js: that file loads at the end of the body, and by then
       the wrong theme has already been painted. */
    (function () {
      try {
        var saved = localStorage.getItem('aimy-ds-theme');
        if (saved === 'light') document.documentElement.setAttribute('data-theme', 'light');
      } catch (e) {}
    })();
  </script>
</head>
<!-- No `data-page` here. It was the FIRST marker-that-was-also-a-handler: the
     chain did `closest('[data-page]')`, body is an ancestor of everything, so
     every unhandled click in the product resolved to "navigate to workbench".
     The handler was renamed to `data-gopage`; this attribute was left behind
     and styled and read nothing. Leaving it is leaving the trap re-armed. -->
<body>

         with the tab strip pinned to the window's centre, and the flanks are
         what the two .topnav-spacer divs balance. A fourth sibling would move
         the centre the spacers exist to hold. Knowledge places it in the same
         element for the same reason. -->
    <button class="rail-toggle" id="railToggle" type="button"
            aria-expanded="false" aria-controls="appRail"

<div class="app-body">

  <!-- ══════════════════════════════════════════════
       THE RAIL — an index of what is reachable, and nothing else.

       It used to hold the briefing, at 22 characters per line: prose in a
       column too narrow to read prose in. The briefing moved to the stage
       and the rail went with it, and that was right about the briefing and
       wrong about the rail — with no rail there was nowhere to SEE what
       exists. Campaigns could only be reached by asking for them, which is
       a fine way to reach a thing you already know the name of and a poor
       way to learn there are seven.

       So it is back, doing the one job a rail is good at: a short, complete
       index of the containers. Not the briefing, not navigation between
       modes, not a chat log. What campaigns there are, what is running, and
       the pool everything else sits in. Names and counts — nothing here is
       prose, so nothing here needs a measure.
  ══════════════════════════════════════════════ -->
  <!-- tabindex="-1" so the drawer can take focus when it opens. A drawer you
       can open from the keyboard and not read from it is worse than no drawer. -->
  <nav class="app-rail" id="appRail" aria-label="What is here" tabindex="-1"></nav>

  <!-- Dismiss surface for the drawer. Sibling of the rail so the two share one
       stacking context and their z-indexes mean something relative to each
       other. Inert and out of the tree until the drawer opens. -->
  <div class="rail-scrim" id="railScrim"></div>

  <!-- ══════════════════════════════════════════════
       THE DOCKED CONVERSATION IS GONE, AND ITS ARGUMENT WITH IT.

       It existed because the canvas was narrow — offset by the sidebar's
       width and blurring the corpus behind it, so a conversation that was
       CHANGING something on screen could not be had inside it. The rail was
       the workaround: dock the thread beside the work instead of over it.

       The canvas is full width now and carries its own chat column, so the
       workaround has nothing left to work around. Its two real contents —
       the touchpoint timeline on a record, the lifecycle on a campaign —
       open the subject's thread in the canvas instead, which is where the
       rest of what was said about that subject already lived. Two places
       holding one conversation was the defect the rail's own comment
       described ("TWO conversation-shaped rails on one page") and never
       quite finished removing.
  ══════════════════════════════════════════════ -->

  <!-- ══════════════════════════════════════════════
       MAIN — type → filters → count → grid, in the order they depend

       ONE ROW PER QUESTION, and the order is the causal one: what am I
       looking at, how is it narrowed, what came back, and then the results.
       The record type used to render below the filter row and beside the
       count, which put a control that DECIDES WHICH FILTERS EXIST underneath
       them, and a result on the same line as the navigation that produced
       it. Four clusters over three rows, none of them grouped by kind.
  ══════════════════════════════════════════════ -->
  <main class="app-main">
    <div class="page-scroll" id="pageScroll">
      <div class="page-inner">

        <!-- WHAT you are looking at, and the one action on the whole
             surface. Above the filters because it is their parent: which
             axes exist follows from the record type, which is why Team draws
             no filter row at all. -->
        <div id="navBar"></div>

        <!-- The filters, visible. Chat sets these same controls, so what AiMY
             understood is shown by the controls lighting up rather than said
             in prose underneath them. -->
        <div id="filterBar"></div>

        <!-- Only for what a dropdown cannot say: several values on one axis,
             free text, an answer's record set, a matched ICP. -->
        <div id="chipBar"></div>

        <!-- The surface: the count of what came back, then the grid, the
             table, the folders, or one record. One region, four shapes. -->
        <div id="wbStage"></div>

      </div>
    </div>

    <!-- ══ The input. Not a chat box — it drives the page. Four routes.
         Fixed and centred on the WINDOW, not on the main column. ══ -->
    <div class="aimy-float-wrap" id="aimyFloatWrap">
      <div class="filter-tray" id="floatFilterTray">
        <div class="filter-tray-inner">
          <button class="filter-chip" data-quick="due=overdue">Overdue</button>
          <button class="filter-chip" data-quick="status=going-cold">Going cold</button>
          <button class="filter-chip" data-quick="status=untouched">Untouched</button>
          <button class="filter-chip" data-quick="owner=mine">Mine</button>
        </div>
      </div>

      <div class="aimy-float-bar" id="aimyFloatBar">
        <!-- Also the way back. Opening a record closes the canvas, and this
             mark reopens the same thread — it already carries the unread
             count, so it is already the thing on screen that means AiMY has
             something for you. -->
        <button class="aimy-float-icon" id="canvasOpen" type="button" aria-label="Open the AiMY canvas">
          <span class="float-badge" hidden aria-label="unread in the canvas">0</span>
          <svg width="18" height="20" viewBox="0 0 18 20"><use href="#aimy-logo-small"/></svg>
        </button>
        <input class="aimy-float-input" id="floatInput" type="text"
               placeholder="Ask, filter, name a lead, or log a touchpoint…"
               autocomplete="off" spellcheck="false" aria-label="Drive the surface" />
        <span class="aimy-float-hint">Enter to run</span>
        <button class="aimy-float-send" id="floatSend" aria-label="Run">
          <svg class="send-icon" viewBox="0 0 14 14" fill="none" width="14" height="14">
            <path d="M6.12 7.88L12.25 1.75M6.2 8.07l1.533 3.942c.135.347.203.521.3.572a.3.3 0 00.3 0c.097-.05.165-.224.3-.572L12.447 2.16c.122-.314.183-.47.15-.57a.3.3 0 00-.21-.21c-.1-.034-.257.027-.57.15L1.99 5.4c-.347.135-.52.203-.571.3a.3.3 0 000 .3c.05.097.224.165.571.3L5.933 7.8c.07.027.106.041.135.062a.3.3 0 01.062.062c.022.03.036.066.063.135z" stroke="white" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <div class="think-spinner"></div>
        </button>
      </div>
    </div>

    <!-- ══ Canvas overlay — opens for questions and generative work only.
         Not for filtering, not for opening a known record, not for writes. ══ -->
    <div class="aimy-overlay" id="aimyOverlay" role="dialog" aria-label="AiMY Canvas">

      <!-- ══ THE CHAT COLUMN ══════════════════════════════════════════════
           Two groups, and the split is the point. ON SCREEN is the thread
           belonging to whatever you have open — this campaign, this account,
           this step — and it persists, so returning to a thing returns you
           to what was said about it. RECENT is the free-standing sessions,
           the questions that were not about one record.

           V1 put a list of past chats in the left rail of the whole product
           and this pass's predecessor deleted it, correctly: a log of
           conversations is not navigation. It is navigation INSIDE a
           conversation, which is where it belongs and where it now is.
      ══════════════════════════════════════════════════════════════════ -->
      <aside class="overlay-chats" id="overlayChats" aria-label="Conversations"></aside>

      <div class="overlay-main">
        <!-- THE BADGE IS GONE. "AiMY Canvas" floated over the thread naming
             the surface you had just opened, beside an input reading "Ask
             AiMY anything…" and under an AiMY mark on the input bar. Three
             statements of the same fact, and the smallest of them was the
             only one that was not also doing something. -->
        <button class="overlay-close" data-overlay-close aria-label="Close canvas">
          <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="2"></line>
            <line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2"></line>
          </svg>
        </button>

        <!-- The canvas shows its basis without being asked. Absolutely
             positioned, so revealing it never shifts the thread. -->
        <div class="overlay-context-bar" id="overlayContextBar">
          <span class="overlay-context-label">Based on</span>
          <div class="overlay-context-tags" id="overlayContextTags"></div>
        </div>

        <!-- The openers are drawn by `paintThread` now, not written here.
             They were static markup that `sug.remove()` deleted on the first
             paint carrying a subject or a turn — and `remove()` is permanent,
             so opening the canvas on a record once cost you the empty-state
             prompts for the rest of the session. A thing that should come
             back has to be rendered, not hidden. -->
        <div class="overlay-thread" id="overlayThread" aria-live="polite"></div>

        <div class="overlay-input-wrap">
          <div class="overlay-input-bar">
            <div class="aimy-float-icon">
              <svg width="16" height="18" viewBox="0 0 18 20"><use href="#aimy-logo-small"/></svg>
            </div>
            <textarea class="overlay-input" id="overlayInput" placeholder="Ask AiMY anything…" rows="1"
                      spellcheck="false" autocomplete="off" data-submit-on-enter aria-label="Ask AiMY"></textarea>
            <button class="overlay-send" id="overlaySend" aria-label="Send">
              <svg viewBox="0 0 14 14" fill="none" width="14" height="14">
                <path d="M6.12 7.88L12.25 1.75M6.2 8.07l1.533 3.942c.135.347.203.521.3.572a.3.3 0 00.3 0c.097-.05.165-.224.3-.572L12.447 2.16c.122-.314.183-.47.15-.57a.3.3 0 00-.21-.21c-.1-.034-.257.027-.57.15L1.99 5.4c-.347.135-.52.203-.571.3a.3.3 0 000 .3c.05.097.224.165.571.3L5.933 7.8c.07.027.106.041.135.062a.3.3 0 01.062.062c.022.03.036.066.063.135z" stroke="white" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
        </div>
      </div><!-- /.overlay-main -->
    </div>
  </main>

  <!-- ══════════════════════════════════════════════
       THE CALL — a shell region, not a modal.

       A call is live and timed, and you move around during one: you open the
       record mid-call, check the campaign brief, look at what was said last
       time. A container that disappears when you navigate cannot hold it, so
       this sits beside the main column and survives everything the URL does.

       Empty and hidden until a call exists. The canvas offsets to clear it
       rather than covering it, and the canvas's chat column is removed for
       the duration — switching session mid-call would swap the surface
       underneath a live conversation, which is the one accident on this
       screen with a person on the other end of it.
  ══════════════════════════════════════════════ -->
  <aside class="app-call" id="callPanel" aria-label="Call in progress" hidden></aside>
</div>

<!-- Drop a list anywhere on the workbench. Covers the whole window, because
     asking someone to aim at a target is the thing drag and drop exists to
     avoid. -->
<div class="drop-layer" id="dropLayer" hidden aria-hidden="true">
  <div class="drop-card">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
    <span class="drop-title">Drop to add leads</span>
    <span class="drop-sub">A record per row, owned by you. Nothing is contacted until you say so.</span>
  </div>
</div>

<!-- The peek: one panel, anchored by script to whatever entity was clicked.
     Lives at the body so it can be anchored to anything. -->
<div class="peek" id="peek" role="dialog" aria-label="About this" hidden></div>

<div id="commitHost"></div>
<div id="toastHost"></div>

<!-- ══════════════════════════════════════════════
     PROTOTYPE CONTROLS — not product UI.

     Collapsed to an icon in the bottom-right corner, expanding upward on
     click. Fixed, so it can never push anything; lifted above the input band
     on the widths where the two would otherwise overlap, because the
     bottom-centre band belongs to the input and the toast.

     Its contents are rendered from the live corpus rather than hard-coded,
     so every link resolves to a record that really is in that state — which
     is the point of it at this stage: reaching a stalled lead, or a campaign
     AiMY is running by itself, should be one click and not a hunt.
══════════════════════════════════════════════ -->
<div class="proto" id="proto">
  <div class="proto-panel" id="protoPanel" hidden></div>
  <button class="proto-toggle" id="protoToggle" type="button"
          aria-expanded="false" aria-controls="protoPanel"
          aria-label="Prototype controls" title="Prototype controls">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>
    </svg>
  </button>
</div>

<script src="assets/aimy-ds.js"></script>
<script src="assets/bdr.js?v=50"></script>
</body>
</html>
